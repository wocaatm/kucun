<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; margin: 0; padding: 12px; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; color: #222; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin-top: 8px; color: #666; }
    input { box-sizing: border-box; width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 7px 0; border: 1px solid #1677ff; background: #fff; color: #1677ff; border-radius: 6px; font: inherit; cursor: pointer; }
    button.primary { background: #1677ff; color: #fff; }
    #status { margin-top: 10px; padding: 8px; background: #f5f7fa; border-radius: 6px; }
    #logs { margin-top: 8px; max-height: 180px; overflow: auto; color: #666; font-size: 12px; white-space: pre-wrap; }
    .muted { color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <h1>小库存 · 淘宝助手</h1>
  <div class="muted">用这个浏览器里的千牛登录态导出订单、拉取商品 SKU。浏览器开着、千牛登录着就行。</div>
  <label>小库存地址 <input id="server" /></label>
  <label>连接码（小库存「我的 → 淘宝插件」里复制） <input id="token" /></label>
  <label>每天自动同步订单的时间 <input id="dailyAt" type="time" /></label>
  <div class="row"><button id="save" class="primary">保存</button></div>
  <div class="row">
    <button id="orders">立即同步订单</button>
    <button id="skus">拉取商品 SKU</button>
  </div>
  <div id="status"></div>
  <div id="logs"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
